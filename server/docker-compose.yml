services:
  oas-control-plane:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      # The direct-IP deployment deliberately publishes plain HTTP/WebSocket.
      # Do not use it on the public internet without firewall restrictions.
      OAS_CONTROL_PLANE_HOST: 0.0.0.0
      OAS_CONTROL_PLANE_PORT: 22270
    ports:
      - "${OAS_CONTROL_PLANE_PORT:-22270}:22270"
    volumes:
      # Device configuration and failure bundles must survive image rebuilds.
      - oas_device_config:/app/config/devices
      - oas_server_log:/app/log
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  oas_device_config:
  oas_server_log:
